<head>

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Hind+Siliguri:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bd2:#B7C6BF;--field:#fff;--ph:#9DB0AA;--dot:rgba(20,49,47,.09);--hov:#E3EEE9;--hovb:#9DB6AD;--act:#D3E4DD;--track:#E3EAE6;--mid:#9DB0AA;--hair:#D3DCD6;--mbody:#F5F7F2;--mbd:#C4CFC7;--mhi:#fff;--msh:rgba(20,49,47,.5);--wbg:#FFF4DC;--wtx:#5B3B00;--onink:#fff;--teal-h:#095A4F;--paper:#E9EFEA;--card:#FCFDFB;--ink:#14312F;--mut:#5B716E;--line:#CAD6D0;--teal:#0B6B5E;--ok:#1E8E5A;--warn:#B96B00;--bad:#C63A3A;--lcd:#BCCBA0;--lcdink:#1E2B1C}
:root[data-theme=dark]{color-scheme:dark;--paper:#0E1A19;--card:#152422;--ink:#E4EFEB;--mut:#8FA8A2;--line:#2A3C39;--teal:#14907E;--teal-h:#0F7A69;--ok:#4CD08E;--warn:#F0A63A;--bad:#FF7A7A;--bd2:#3C5450;--field:#0F1D1B;--ph:#5E7771;--dot:rgba(255,255,255,.05);--hov:#1F3431;--hovb:#4A6A64;--act:#27423E;--track:#233633;--mid:#5E7771;--hair:#2A3C39;--mbody:#26302E;--mbd:#3A4743;--mhi:rgba(255,255,255,.07);--msh:rgba(0,0,0,.75);--wbg:#33290F;--wtx:#F1D9A0;--onink:#0E1A19}
*{box-sizing:border-box;margin:0}
body{font-family:'Hind Siliguri','Bricolage Grotesque',system-ui,sans-serif;color:var(--ink);line-height:1.55;min-height:100vh;background-color:var(--paper);background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:22px 22px}
.wrap{max-width:1040px;margin:auto;padding:22px 20px 56px}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:34px}
.brand{display:flex;align-items:center;gap:8px;font-family:'Bricolage Grotesque','Hind Siliguri',sans-serif;font-weight:700;font-size:21px}
.brand .ic{width:22px;height:22px;color:var(--teal)}
.right{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.tag{color:var(--mut);font-size:14px}
.theme{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;padding:0}
.theme:hover{background:var(--hov);border-color:var(--hovb)}
.theme .ic{width:19px;height:19px}.theme .sun{display:none}
:root[data-theme=dark] .theme .sun{display:block}:root[data-theme=dark] .theme .moon{display:none}
.lang{display:flex;padding:3px;border:1.5px solid var(--line);border-radius:99px;background:var(--card)}
.lang button{border:0;background:transparent;color:var(--mut);padding:5px 14px;border-radius:99px;font-size:14px;font-weight:600}
.lang button.on{background:var(--ink);color:var(--onink)}
h1{font-family:'Bricolage Grotesque','Hind Siliguri',sans-serif;font-size:clamp(32px,5.2vw,52px);line-height:1.1;letter-spacing:-1.2px;max-width:660px;font-weight:700}
.lead{color:var(--mut);margin:12px 0 30px;font-size:18px;max-width:560px}
.grid{display:grid;grid-template-columns:1.12fr .88fr;gap:28px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px}
h2{font-family:'Bricolage Grotesque','Hind Siliguri',sans-serif;font-size:22px;font-weight:700}
.sub{color:var(--mut);font-size:14.5px;margin:2px 0 18px}
.grp{font-weight:600;font-size:15px;margin:24px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.grp.first{margin-top:0}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px}
@media(max-width:480px){.fields{grid-template-columns:1fr}}
label,.lab{display:flex;align-items:center;gap:7px;font-size:14.5px;font-weight:500;margin-bottom:6px}
label .ic,.lab .ic{color:var(--mut)}
label small{color:var(--mut);font-weight:400;font-size:13px}
.in{position:relative}
.in input{width:100%;padding:12px 82px 12px 14px;border-radius:10px;border:1.5px solid var(--bd2);background:var(--field);color:var(--ink);font:inherit;font-size:18px;outline:none;transition:border-color .15s;-moz-appearance:textfield;appearance:textfield}
.in input::-webkit-outer-spin-button,.in input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.in input::placeholder{color:var(--ph)}
input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(11,107,94,.16)}
input.bad{border-color:var(--bad)}
.st{position:absolute;right:7px;top:50%;transform:translateY(-50%);display:flex;gap:5px}
.st button{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:19px;line-height:1;padding:0;display:grid;place-items:center}
.st button:hover{background:var(--hov);border-color:var(--hovb)}
.st button:active{background:var(--act)}
.seg{display:flex;gap:8px}
.seg input{position:absolute;opacity:0}
.seg label{flex:1;margin:0;justify-content:center;padding:11px 6px;border-radius:10px;border:1.5px solid var(--bd2);background:var(--field);cursor:pointer;font-size:16px;font-weight:500}
.seg label .ic{color:inherit}
.seg input:checked+label{background:var(--teal);border-color:var(--teal);color:#fff}
.seg input:focus-visible+label{box-shadow:0 0 0 3px rgba(11,107,94,.25)}
.full{grid-column:1/-1}
.units{display:flex;gap:6px;float:right}
.units button{font-size:12.5px;padding:3px 11px;border-radius:99px;background:transparent;border:1.5px solid var(--line);color:var(--mut);font-weight:600}
.units button.on{background:var(--ink);border-color:var(--ink);color:var(--onink)}
.chip{font-size:14px;color:var(--mut)}
.sw{margin:0;padding:12px 14px;border-radius:10px;border:1.5px solid var(--bd2);background:var(--field);cursor:pointer;gap:12px;font-size:15.5px}
.sw input{width:20px;height:20px;accent-color:var(--teal)}
.sw .ic{color:var(--bad);width:21px;height:21px}
.sw small{display:block;color:var(--mut);font-size:12.5px}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:14px}
.btns{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border-radius:12px;padding:14px 22px;font-weight:600;font-size:16.5px;border:1.5px solid transparent}
.go{flex:1;min-width:180px;background:var(--teal);color:#fff}
.go:hover{background:var(--teal-h)}
.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.ghost:hover{background:var(--hov);border-color:var(--hovb)}
button:focus-visible,summary:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
.side{position:sticky;top:16px}
.side h2{margin-bottom:12px}
.meter{background:var(--mbody);border:1.5px solid var(--mbd);border-radius:30px;padding:16px 16px 22px;box-shadow:0 1px 0 var(--mhi) inset,0 24px 34px -20px var(--msh)}
.mt{display:flex;justify-content:space-between;align-items:center;padding:0 6px 11px;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:13px;color:var(--mut)}
#led{width:11px;height:11px;border-radius:50%;background:#B8C2BC;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.15);transition:background .4s}
.lcd{background:var(--lcd);border-radius:14px;padding:13px 16px 11px;color:var(--lcdink);font-family:'Share Tech Mono','Hind Siliguri',monospace;box-shadow:inset 0 3px 9px rgba(30,43,28,.38),inset 0 0 0 2px #9FAE85}
.lr{display:flex;justify-content:space-between;font-size:13px;letter-spacing:1px;text-transform:uppercase}
.ln{font-size:80px;line-height:1.05;display:flex;justify-content:flex-end;align-items:baseline;gap:4px;margin:2px 0 8px}
@media(max-width:480px){.ln{font-size:64px}}
.ln small{font-size:26px}
.segs{display:grid;grid-template-columns:repeat(25,1fr);gap:3px;height:20px}
.segs i{background:rgba(30,43,28,.13);border-radius:2px}
.segs i.on{background:var(--lcdink)}
.sc{display:flex;justify-content:space-between;font-size:11px;margin-top:4px;opacity:.7}
.empty{color:var(--mut);font-size:15px;padding:18px 6px 0}
.vd{display:flex;gap:12px;align-items:flex-start;padding:18px 6px 0}
.vd .ic{width:28px;height:28px;margin-top:2px}
.vd h3{font-family:'Bricolage Grotesque','Hind Siliguri',sans-serif;font-size:24px;line-height:1.2}
.vd .st2{font-weight:600;font-size:14.5px}
.vd p{color:var(--mut);font-size:14.5px;margin-top:3px}
.why{display:none;margin:18px 6px 0;padding-top:14px;border-top:1px solid var(--hair)}
.why h4{font-size:15px;margin-bottom:10px}
.why li{list-style:none;display:flex;gap:12px;padding:9px 0;font-size:14.5px;border-bottom:1px dashed var(--hair)}
.why li:last-child{border:0}
.why b{display:block;font-weight:600}
.why span{color:var(--mut)}
.dir{width:0;height:0;margin-top:7px;flex:none;border-left:6px solid transparent;border-right:6px solid transparent}
.dir.up{border-bottom:10px solid var(--bad)}.dir.dn{border-top:10px solid var(--ok)}
.more{margin-top:28px}
details{border:1px solid var(--line);border-radius:12px;margin-top:10px;background:var(--card)}
summary{padding:15px 20px;cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
summary span{display:flex;align-items:center;gap:10px}
summary span .ic{color:var(--mut)}
summary::after{content:'+';font-size:22px;line-height:1;color:var(--teal)}details[open] summary::after{content:'−'}
.body{padding:0 20px 20px}
.bar{display:grid;grid-template-columns:130px 1fr 48px;gap:10px;align-items:center;margin:9px 0;font-size:14px}
@media(max-width:480px){.bar{grid-template-columns:100px 1fr 44px}}
.tr{height:12px;border-radius:3px;background:var(--track);position:relative;overflow:hidden}
.fl{height:100%}
.dv .tr{background:linear-gradient(90deg,transparent 49.6%,var(--mid) 49.6% 50.4%,transparent 50.4%),var(--track)}
.dv .fl{position:absolute;top:0}
.note{color:var(--mut);font-size:13.5px;margin-top:10px}
.warn{display:flex;gap:12px;margin-top:24px;padding:14px 18px;border-radius:10px;background:var(--wbg);border-left:4px solid var(--warn);color:var(--wtx);font-size:14px}
.warn .ic{color:var(--warn);width:21px;height:21px;margin-top:2px}
footer{color:var(--mut);font-size:13px;margin-top:28px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

let lang='en',unit='mmol',last=null;
try{lang=localStorage.getItem('gs-lang')||'en'}catch(e){}
const t=k=>T[lang][k];
const n=s=>lang==='bn'?String(s).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]):String(s);
const F=[{k:'glucose',c:.9,r:7.4},{k:'hyp',c:1.3,r:.5},{k:'age',c:.03,r:45},{k:'bmi',c:.04,r:25},{k:'dia',c:.01,r:88},{k:'sys',c:.008,r:140},{k:'pulse',c:.015,r:75},{k:'gender',c:.1,r:.5}];
const IMP=[['glucose',.52],['hyp',.16],['bmi',.06],['dia',.05],['weight',.05],['age',.04],['pulse',.04],['sys',.03],['height',.03],['gender',.03]];
const MOD=[['Random Forest',94],['XGBoost',92],['Decision Tree',89],['TabNet',89],['SVM',89],['KNN',87],['ANN',87]];
const bar=(name,w,v,bg)=>`<div class="bar"><span>${name}</span><div class="tr"><div class="fl" style="width:${w}%;background:${bg}"></div></div><span>${v}</span></div>`;
const segs=[...Array(25)].map(()=>{const i=document.createElement('i');$('segs').append(i);return i});
const setSeg=k=>segs.forEach((e,j)=>e.classList.toggle('on',j<k));
function buildStatic(){
 $('imp').innerHTML=IMP.map(([k,v])=>bar(t('f')[k],v/.52*100,n(v.toFixed(2)),'var(--teal)')).join('');
 $('acc').innerHTML=MOD.map(([m,v])=>bar(m,v,n(v)+'%','var(--ink)')).join('')}
function bmi(){const h=num('height')/100,w=num('weight');
 if(h>0&&w>0){const b=w/(h*h),c=b<18.5?0:b<25?1:b<30?2:3;$('bmi').textContent=t('bmiIs')+n(b.toFixed(1))+' ('+t('bmiC')[c]+')';return b}
 $('bmi').textContent=t('bmiAuto');return NaN}
function applyLang(){
 document.documentElement.lang=lang;document.title=t('title');
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
 document.querySelectorAll('[data-h]').forEach(e=>e.innerHTML=t(e.dataset.h));
 document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
 document.querySelectorAll('.st button').forEach(b=>b.setAttribute('aria-label',+b.dataset.d<0?t('dec'):t('inc')));
 buildStatic();bmi();updTheme();
 if(last)show(last,false);else resetResult();
 try{localStorage.setItem('gs-lang',lang)}catch(e){}}
const root=document.documentElement;
function updTheme(){const l=root.dataset.theme==='dark'?t('themeL'):t('themeD');$('theme').setAttribute('aria-label',l);$('theme').title=l}
$('theme').onclick=()=>{const d=root.dataset.theme==='dark'?'light':'dark';root.dataset.theme=d;try{localStorage.setItem('gs-theme',d)}catch(e){}updTheme()};
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;applyLang()});
function resetResult(){
 $('pct').textContent='--';setSeg(0);$('led').style.background='';$('lcdMsg').textContent=t('ready');
 $('verdict').innerHTML='<div class="empty">'+t('empty')+'</div>';
 $('why').style.display='none';$('contrib').innerHTML='<p class="note">'+t('n1')+'</p>'}

document.querySelectorAll('.st button').forEach(b=>b.onclick=()=>{
 const i=b.closest('.in').querySelector('input'),st=parseFloat(i.dataset.step),mn=parseFloat(i.dataset.min),mx=parseFloat(i.dataset.max);
 const dec=(String(st).split('.')[1]||'').length;
 let v=i.value===''?parseFloat(i.dataset.def):parseFloat(i.value)+(+b.dataset.d)*st;
 v=Math.min(mx,Math.max(mn,v));i.value=v.toFixed(dec).replace(/\.0+$/,'');
 i.dispatchEvent(new Event('input',{bubbles:true}))});
document.querySelectorAll('input[type=number]').forEach(i=>{
 i.addEventListener('keydown',e=>{if(['-','+','e','E'].includes(e.key))e.preventDefault()});
 i.addEventListener('paste',e=>{const x=(e.clipboardData||window.clipboardData).getData('text');if(/[^0-9.]/.test(x))e.preventDefault()});
 i.addEventListener('input',()=>{if(i.value!==''&&parseFloat(i.value)<0)i.value=Math.abs(i.value)})});
['height','weight'].forEach(i=>$(i).addEventListener('input',bmi));
['sys','dia'].forEach(i=>$(i).addEventListener('input',()=>{if(num('sys')>=140||num('dia')>=90)$('hyp').checked=true}));
document.querySelectorAll('.units button').forEach(b=>b.onclick=()=>{
 const old=unit,g=$('glucose');unit=b.dataset.u;
 document.querySelectorAll('.units button').forEach(x=>x.classList.toggle('on',x===b));
 const mg=unit==='mg';g.dataset.step=mg?1:.1;g.dataset.def=mg?135:7.5;g.dataset.min=mg?18:1;g.dataset.max=mg?720:40;g.placeholder=mg?'135':'7.5';
 const v=num('glucose');if(!isNaN(v)&&old!==unit)g.value=mg?Math.round(v*18):(v/18).toFixed(1)});
$('demo').onclick=()=>{if(unit==='mg')document.querySelector('[data-u=mmol]').click();
 Object.entries({age:51,height:164,weight:49.5,glucose:10.8,sys:159,dia:92,pulse:79}).forEach(([k,v])=>$(k).value=v);
 $('gm').checked=true;$('hyp').checked=true;bmi();$('err').textContent=''};
$('reset').onclick=()=>setTimeout(()=>{last=null;bmi();$('err').textContent='';
 document.querySelectorAll('input.bad').forEach(i=>i.classList.remove('bad'));resetResult()},0);
$('form').addEventListener('submit',e=>{
 e.preventDefault();
 let g=num('glucose');if(unit==='mg')g/=18;
 const a=num('age'),h=num('height'),w=num('weight'),s=num('sys'),d=num('dia'),p=num('pulse'),bad=[];
 if(!(a>=1&&a<=110))bad.push('age');if(!(h>=100&&h<=220))bad.push('height');if(!(w>=20&&w<=250))bad.push('weight');
 if(!(g>=1&&g<=40))bad.push('glucose');if(!(s>=60&&s<=260))bad.push('sys');if(!(d>=30&&d<=160&&d<s))bad.push('dia');if(!(p>=30&&p<=220))bad.push('pulse');
 ['age','height','weight','glucose','sys','dia','pulse'].forEach(i=>$(i).classList.toggle('bad',bad.includes(i)));
 const gen=document.querySelector('input[name=g]:checked');
 if(bad.length||!gen){$('err').textContent=bad.length?t('e1'):t('e2');return}
 $('err').textContent='';
 show({age:a,gender:+gen.value,pulse:p,glucose:g,sys:s,dia:d,bmi:bmi(),hyp:$('hyp').checked?1:0},true)});

function show(v,anim){
 last=v;
 const parts=F.map(f=>({...f,val:v[f.k],s:f.c*(v[f.k]-f.r)}));
 const prob=1/(1+Math.exp(-(parts.reduce((a,x)=>a+x.s,0)+.65)));
 const i=prob<.35?0:prob<.6?1:2,col=['var(--ok)','var(--warn)','var(--bad)'][i],icn=['ok','alert','warn'][i];
 $('led').style.background=col;$('lcdMsg').textContent=t('lv')[i];
 $('verdict').innerHTML=`<div class="vd"><svg class="ic" style="color:${col}" aria-hidden="true"><use href="#i-${icn}"/></svg><div><h3 style="color:${col}">${t('lv')[i]}</h3><div class="st2">${prob>=.5?t('yes'):t('no')}</div><p>${t('msg')[i]}</p></div></div>`;
 const end=Math.round(prob*100),on=Math.round(prob*25);
 const paint=k=>{$('pct').textContent=n(Math.round(end*k));setSeg(Math.round(on*k))};
 if(anim){const t0=performance.now();(function tick(ts){const k=Math.min(1,(ts-t0)/1100);paint(1-Math.pow(1-k,3));if(k<1)requestAnimationFrame(tick)})(t0)}else paint(1);
 const sorted=[...parts].sort((a,b)=>Math.abs(b.s)-Math.abs(a.s));
 const txt=x=>{const u=x.s>0,R=t('r');return (x.k==='dia'||x.k==='sys'?R.bp:R[x.k])(x,u)};
 $('rl').innerHTML=sorted.slice(0,3).map(x=>`<li><i class="dir ${x.s>0?'up':'dn'}"></i><div><b>${t('f')[x.k]}</b><span>${n(txt(x))}</span></div></li>`).join('');
 $('why').style.display='block';
 const mx=Math.max(...parts.map(x=>Math.abs(x.s)),.5);
 $('contrib').innerHTML=sorted.map(x=>{const w=Math.abs(x.s)/mx*50,pos=x.s>0;
  return `<div class="bar"><span>${t('f')[x.k]}</span><div class="tr"><div class="fl" style="width:${w}%;left:${pos?50:50-w}%;background:${pos?'var(--bad)':'var(--ok)'}"></div></div><span>${n((pos?'+':'')+x.s.toFixed(1))}</span></div>`}).join('');
 if(anim&&innerWidth<860)document.querySelector('.side').scrollIntoView({behavior:'smooth'});
}
applyLang();
</script>
</body>
</html>
